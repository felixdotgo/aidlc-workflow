services:
  mcp-state:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - mcp-state-data:/data
    environment:
      MCP_STATE_DATABASE: sqlite
      MCP_STATE_SQLITE_PATH: /data/mcp-state.db

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: aidlc
      POSTGRES_USER: aidlc
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  mcp-state-data:
  postgres-data:
